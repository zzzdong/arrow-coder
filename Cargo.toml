[workspace]
resolver = "2"
members = [
    "crates/arrow-coder-core",
    "crates/arrow-coder-cli",
    "crates/arrow-coder-vscode",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
dirs = "6"
hex = "0.4"
html5ever = "0.39"
markup5ever_rcdom = "0.39"
futures = "0.3"
glob = "0.3"
grep = "0.4"
lazy_static = "1"
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
termcolor = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net", "signal"] }
tracing = "0.1"
urlencoding = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
which = { version = "8", default-features = false }
