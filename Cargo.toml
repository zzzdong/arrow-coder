[package]
name = "arrow-code"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
hex = "0.4"
html5ever = "0.27"
markup5ever_rcdom = "0.3"
futures = "0.3"
glob = "0.3"
grep = "0.3"
lazy_static = "1"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
termcolor = "1"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "sync", "io-util", "net", "signal"] }
tracing = "0.1"
urlencoding = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
which = { version = "6", default-features = false }

[dev-dependencies]
