# Arrow Code Configuration File
# Place this file at ~/.arrowcode/config.toml or .arrowcode/config.toml (project-local)

# Active model name to use (points at a [[models]].name in the models file)
active_model = "deepseek-flash"

# Standalone model-definition file. Model definitions live here (in
# models.example.toml) instead of inline. The path is resolved relative to
# this file (or absolute). Leave unset to define [[models]] inline in this
# file instead.
models_file = "models.example.toml"

# Default agent profile
default_agent = "default"

# Behavior settings
bypass_tool_permissions = false
context_warnings = true

# =============================================================================
# Models
# -----------------------------------------------------------------------------
# Model definitions now live in `models.example.toml` (see `models_file`
# above). Each model is SELF-CONTAINED — there is no separate [[providers]] or
# [[endpoints]] layer.
#
# Providers are BUILT IN (not configurable strings) — exactly two kinds:
#
#   provider = "deepseek"    请求端点固化为 DeepSeek 官方 API
#                            (https://api.deepseek.com，不可改)。只需选 model_id
#                            和填 api_key（省略则用 $DEEPSEEK_API_KEY）。
#   provider = "openai_compatible"
#                            OpenAI 兼容。可自由配置 endpoint(URL)、api_key、
#                            model_id 等。endpoint 省略则默认
#                            https://api.openai.com/v1，key 省略则用
#                            $OPENAI_API_KEY。
#
#   name       display identifier (used by active_model / the selector)
#   model_id   model id sent to the API (e.g. deepseek-chat for v4 flash,
#              deepseek-reasoner for v4 pro)
#   endpoint   openai_compatible 才生效；deepseek 忽略此字段（端点已固化）
#
# Multiple models may use the same provider with different model ids and keys
# (e.g. a flash and a pro DeepSeek model, or several OpenAI-compatible
# gateways with freely-configurable URLs).
#
# You may also define [[models]] inline in this file instead of using a
# models_file; inline entries and the models file are merged, with the file
# winning on name conflicts.
# =============================================================================

# =============================================================================
# 示例：直接内联 [[models]]（不依赖 models_file 时）
# -----------------------------------------------------------------------------
# [[models]]
# name = "deepseek-flash"
# model_id = "deepseek-chat"
# provider = "deepseek"        # 端点固化，不配 endpoint
# temperature = 0.2
# max_tokens = 64000
# thinking = "high"
# reasoning_effort = "high"
#
# [[models]]
# name = "local"
# model_id = "local"
# provider = "openai_compatible"   # OpenAI 兼容，配 endpoint
# endpoint = "http://127.0.0.1:8080/v1"
# =============================================================================

# Skill paths - additional directories to search for skills
# skill_paths = ["~/custom-skills", "./my-skills"]

# Enable/disable specific skills
# enabled_skills = ["vibe", "rust-dev", "python-dev"]
# disabled_skills = ["experimental-skill"]

# Tool configuration
# [tools.bash]
# permission = "ask"
#
# [tools.write_file]
# permission = "ask"

