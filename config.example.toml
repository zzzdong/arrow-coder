# [[models]]
# name = "deepseek-chat"
# provider = "deepseek"
# alias = "deepseek"
# temperature = 0.2
# max_tokens = 64000
# input_price = 0.5
# output_price = 2.0
# # DeepSeek thinking mode. `thinking` accepts a switch or a preset effort:
# #   "enabled" | "disabled" | "auto"   (switch; "auto"/unset = provider default)
# #   "low" | "medium" | "high" | "xhigh" | "max"   (enables thinking at that tier)
# # When a preset effort string is used, reasoning_effort is sent automatically.
# # Canonical wire tiers: low < high (medium/xhigh collapse to high) < max.
# # Note: temperature/top_p are IGNORED by DeepSeek while thinking is enabled.
# thinking = "high"
# # Optional explicit effort override (low|medium|high|xhigh|max); only used
# # when `thinking` is a switch rather than a preset effort.
# # reasoning_effort = "high"

