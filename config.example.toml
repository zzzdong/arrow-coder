# Arrow Code Configuration File
# Place this file at ~/.arrowcode/config.toml or .arrowcode/config.toml (project-local)

# Active model name to use (points at a [[models]].name in the models file)
active_model = "deepseek-flash"

# Standalone model-definition file. Model definitions live here (in
# models.example.toml) instead of inline. The path is resolved relative to
# this file (or absolute). Leave unset to define [[models]] inline in this
# file instead.
models_file = "models.example.toml"

# Default agent profile
default_agent = "default"

# Behavior settings
bypass_tool_permissions = false
context_warnings = true

# =============================================================================
# Models
# -----------------------------------------------------------------------------
# Model definitions now live in `models.example.toml` (see `models_file`
# above). Each model is SELF-CONTAINED — there is no separate [[providers]] or
# [[endpoints]] layer.
#
# A model's `provider` field REFERENCES a built-in provider PRESET, which
# supplies the endpoint, reasoning field, key env var, and sampling defaults
# (temperature/max_tokens). Override any of those with the model's own fields
# when needed. This keeps the common case terse — `provider = "deepseek"` already
# implies the official endpoint, reasoning field, key env var, and defaults.
#
# Built-in provider presets:
#   provider = "deepseek"           -> https://api.deepseek.com         (reasoning_content, $DEEPSEEK_API_KEY)
#   provider = "deepseek-responses" -> https://api.deepseek.com         (reasoning,           $DEEPSEEK_API_KEY)
#   provider = "openai"             -> https://api.openai.com/v1         (reasoning,           $OPENAI_API_KEY)
#   provider = "anthropic"          -> https://api.anthropic.com         (no reasoning field,  $ANTHROPIC_API_KEY)
#   provider = "local"              -> http://127.0.0.1:8080/v1          (OpenAI-compatible,   $OPENAI_API_KEY)
#   provider = "openai_compatible"  -> alias for "openai" (configurable URL)
#
#   name       display identifier (used by active_model / the selector)
#   model_id   model id sent to the API (e.g. deepseek-chat, deepseek-reasoner)
#   endpoint   OVERRIDES the preset's default URL for EVERY provider — so
#              `models.toml` fully determines the LLM access info. Omit it to
#              use the preset's built-in endpoint.
#   temperature / max_tokens  OVERRIDE the preset defaults when set.
#
# Multiple models may use the same preset with different model ids, keys, or
# overridden endpoints (e.g. a flash and a pro DeepSeek model, or several
# OpenAI-compatible gateways pointing at different URLs).
#
# You may also define [[models]] inline in this file instead of using a
# models_file; inline entries and the models file are merged, with the file
# winning on name conflicts.
# =============================================================================

# =============================================================================
# 示例：直接内联 [[models]]（不依赖 models_file 时）
# -----------------------------------------------------------------------------
# [[models]]
# name = "deepseek-flash"
# model_id = "deepseek-chat"
# provider = "deepseek"        # endpoint/temp/max_tokens 来自预设，无需重复
# thinking = "high"
# reasoning_effort = "high"
#
# --- Standalone model.toml ---
# Models can also be defined in a dedicated `model.toml` file (either
# `~/.arrowcode/model.toml` (user) or `.arrowcode/model.toml` (project, takes
# precedence)). A model may be fully self-contained and point at any
# OpenAI-compatible endpoint without a separate [[providers]] entry. The
# openai-compatible backend is the default.
#
# [[model]]
# name = "qwen3.8"
# model_id = "qwen3.5"            # wire model id sent to the API (defaults to `name`)
# endpoint = "https://localhost:8000/v1/chat/completions"
# api_key = "xxx"
# verify_tls = false              # disable TLS verification for self-signed certs
# headers = { cookie = "xxxxxxxxxxxxxxxxx" }   # extra HTTP headers on every request
# alias = "qwen3"
# temperature = 0.2               # sampling temperature (default 0.2)
# top_p = 0.95                    # nucleus sampling threshold (optional)
# top_k = 20                      # top-K sampling (optional)
# presence_penalty = 0.0          # repeat penalty (optional)
# max_tokens = 8192               # max completion tokens (auto-clamped to remaining context window)
# context_window = 131072         # model context window in tokens (default 128k); MUST be <= the serving backend's limit
#                                 # (e.g. vLLM --max-model-len). Drives auto-compaction AND the max_tokens safety clamp that
#                                 # prevents the backend from cutting the connection on overflow.
# auto_compact_threshold = 100000 # compact when session reaches this many tokens (default: 80% of context_window)
# thinking = "high"               # optional extended-thinking mode
#
# [[models]]
# name = "local"
# model_id = "local"
# provider = "local"           # 预设已含本地 endpoint，无需重复
# =============================================================================

