# Arrow Code Configuration File
# Place this file at ~/.vibe/config.toml or .vibe/config.toml (project-local)

# Active model alias to use
active_model = "mistral-medium"

# Default agent profile
default_agent = "default"

# Behavior settings
bypass_tool_permissions = false
context_warnings = true

