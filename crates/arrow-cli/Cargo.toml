[package]
name = "arrow-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI client for Arrow Coder"

[[bin]]
name = "arrow"
path = "src/main.rs"

[dependencies]
arrow-core = { workspace = true }
arrow-engine = { workspace = true }
arrow-llm = { workspace = true }
arrow-knowledge = { workspace = true }

# Async
tokio = { workspace = true, features = ["full"] }

# CLI
clap = { workspace = true }

# HTTP server (for serve mode)
axum = { version = "0.8", features = ["http1", "tokio", "json"] }
tower = { workspace = true }
tower-http = { workspace = true }

# TUI
ratatui = "0.30"
crossterm = "0.28"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"

# Configuration
directories = "6.0.0"
toml = "0.8"

# Cancellation
tokio-util = { version = "0.7", features = ["rt"] }

# UUID
uuid = { workspace = true }
