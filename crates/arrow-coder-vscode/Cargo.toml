[package]
name = "arrow-coder-vscode"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "arrow-coder-vscode"
path = "src/main.rs"

[lib]
name = "arrow_coder_vscode"
path = "src/lib.rs"

[dependencies]
arrow-coder-core = { path = "../arrow-coder-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "io-std", "sync", "process", "time", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
