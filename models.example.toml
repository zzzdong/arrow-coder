# models.example.toml
#
# A standalone model-definition file, referenced from the main config via:
#
#   models_file = "models.toml"
#
# Each model REFERENCES a built-in provider preset via `provider`. The preset
# supplies the endpoint, reasoning field, key env var, and sampling defaults —
# so the common case stays terse. Override any of those with the model's own
# fields (`endpoint`, `temperature`, `max_tokens`, …) when you need to.
#
# Built-in provider presets:
#   deepseek            -> https://api.deepseek.com        (kind "deepseek",        reasoning_content, DEEPSEEK_API_KEY, temp 0.7, top_p 0.95, 64000 tok)
#   deepseek-responses  -> https://api.deepseek.com        (kind "deepseek-responses", reasoning,      DEEPSEEK_API_KEY, temp 0.7, top_p 0.95, 64000 tok)
#   openai              -> https://api.openai.com/v1        (kind "openai",          reasoning,         OPENAI_API_KEY,    temp 0.7, 8192 tok)
#   anthropic           -> https://api.anthropic.com        (kind "anthropic",       no reasoning field,ANTHROPIC_API_KEY, temp 0.7, 8192 tok)
#   local               -> http://127.0.0.1:8080/v1         (kind "openai",          no reasoning field,OPENAI_API_KEY(local),temp 0.7, 4096 tok)
#   openai_compatible   -> alias for "openai" (configurable URL)
#
# DeepSeek's official sampling guidance: reasoning at the `max` effort tier,
# temperature = 1.0, top_p = 0.95. The deepseek preset already defaults top_p
# to 0.95, so a model only needs to set temperature=1.0 and reasoning_effort="max".

# --- Reference a built-in provider: endpoint + temperature + max_tokens all
#     come from the preset; you only set the model id. ---
[[models]]
name = "deepseek-flash"
model_id = "deepseek-chat"
provider = "deepseek"
thinking = "high"
reasoning_effort = "high"
# temperature / max_tokens omitted -> inherit preset defaults (0.7 / 64000)
# top_p omitted -> inherits the deepseek preset default (0.95)
auto_compact_threshold = 64000

# --- DeepSeek official sampling (max effort tier, temp 1.0, top_p 0.95) ---
[[models]]
name = "deepseek-v4-flash"
model_id = "deepseek-v4-flash"
provider = "deepseek"
reasoning_effort = "max"      # DeepSeek "max" effort tier
temperature = 1.0
top_p = 0.95
max_tokens = 256000

[[models]]
name = "deepseek-pro"
model_id = "deepseek-reasoner"
provider = "deepseek"            # same preset, different model id + effort
thinking = "high"
reasoning_effort = "max"

[[models]]
name = "gpt4o"
model_id = "gpt-4o"
provider = "openai"              # uses the OpenAI preset endpoint + key env

# --- A local OpenAI-compatible server: the `local` preset already points at
#     the default localhost URL, so no endpoint needed. ---
[[models]]
name = "local"
model_id = "local-model"
provider = "local"
temperature = 0.7
max_tokens = 4096
auto_compact_threshold = 8000

# --- Override the preset's endpoint: repoint DeepSeek at a custom gateway.
#     `models.toml` can fully determine the LLM access info. ---
[[models]]
name = "deepseek-gateway"
model_id = "deepseek-chat"
provider = "deepseek"
endpoint = "https://my-gateway.example.com/deepseek/v1"
temperature = 0.3               # override the preset default temperature
api_key = "sk-..."              # optional inline key (else $DEEPSEEK_API_KEY)

# --- A fully custom OpenAI-compatible endpoint (legacy alias still works). ---
[[models]]
name = "custom-openai"
model_id = "my-model"
provider = "openai_compatible"
endpoint = "https://custom.example.com/v1"
temperature = 0.5
max_tokens = 16384
